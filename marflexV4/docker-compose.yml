version: '3.8'

services:
  mysql:
    build:
      context: ./src/backend/dockerfile
      dockerfile: Dockerfile.mysql
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: bdmarflex
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    restart: always
    networks:
      - marflexnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 123456789
    ports:
      - "8080:80"
    restart: always
    networks:
      - marflexnet

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - "3001:3001"
    env_file:
      - ./src/backend/.env
    restart: always
    depends_on:
      - mysql
    networks:
      - marflexnet

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always
    depends_on:
      - backend
    networks:
      - marflexnet

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - marflexnet

networks:
  marflexnet:
    driver: bridge